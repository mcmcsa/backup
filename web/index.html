<!DOCTYPE html>
<html>
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="PSU Maintenance System - Modern facility management platform.">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="PSU MaintSystem">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>PSU MaintSystem - Administration Portal</title>
  <link rel="manifest" href="manifest.json">

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      margin: 0;
      padding: 0;
      background: #0B1120;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, 'Helvetica Neue', sans-serif;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
      color: #F8FAFC;
      line-height: 1.5;
    }

    /* Loading indicator */
    #loading {
      display: flex;
      align-items: center;
      justify-content: center;
      height: 100vh;
      background: #0B1120;
      position: relative;
      overflow: hidden;
    }

    /* Subtle background glow */
    #loading::before {
      content: '';
      position: absolute;
      width: 400px;
      height: 400px;
      background: radial-gradient(circle, rgba(59,130,246,0.1) 0%, rgba(11,17,32,0) 70%);
      border-radius: 50%;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
    }

    .loading-spinner {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 24px;
      z-index: 10;
    }
    
    .logo-container {
      width: 80px;
      height: 80px;
      background: rgba(255, 255, 255, 0.03);
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 10px 30px -10px rgba(0,0,0,0.5), 0 0 20px rgba(59,130,246,0.2);
      backdrop-filter: blur(10px);
      animation: pulse 2s ease-in-out infinite alternate;
    }

    .logo-container img {
      width: 50px;
      height: 50px;
      object-fit: contain;
    }

    @keyframes pulse {
      0% { transform: scale(1); box-shadow: 0 10px 30px -10px rgba(0,0,0,0.5), 0 0 20px rgba(59,130,246,0.2); }
      100% { transform: scale(1.05); box-shadow: 0 15px 40px -10px rgba(0,0,0,0.6), 0 0 40px rgba(59,130,246,0.4); }
    }

    .progress-bar {
      width: 200px;
      height: 4px;
      background: rgba(255, 255, 255, 0.1);
      border-radius: 4px;
      overflow: hidden;
      position: relative;
    }

    .progress-fill {
      position: absolute;
      top: 0;
      left: 0;
      height: 100%;
      width: 50%;
      background: linear-gradient(90deg, #3B82F6, #06B6D4);
      border-radius: 4px;
      animation: loadProgress 2s ease-in-out infinite;
      box-shadow: 0 0 10px rgba(6, 182, 212, 0.5);
    }

    @keyframes loadProgress {
      0% { left: -50%; width: 50%; }
      50% { left: 25%; width: 50%; }
      100% { left: 100%; width: 50%; }
    }

    .loading-text {
      font-size: 12px;
      color: #94A3B8;
      font-weight: 600;
      letter-spacing: 2px;
      text-transform: uppercase;
    }

    /* Scrollbar styling */
    ::-webkit-scrollbar {
      width: 8px;
      height: 8px;
    }

    ::-webkit-scrollbar-track {
      background: transparent;
    }

    ::-webkit-scrollbar-thumb {
      background: #CBD5E1;
      border-radius: 4px;
    }

    ::-webkit-scrollbar-thumb:hover {
      background: #94A3B8;
    }

    /* Selection color */
    ::selection {
      background-color: #3B82F6;
      color: white;
    }

  </style>
</head>
<body>
  <div id="loading">
    <div class="loading-spinner">
      <div class="logo-container">
        <!-- Optional: we can put a local base64 image or just rely on CSS -->
      </div>
      <div class="progress-bar">
        <div class="progress-fill"></div>
      </div>
      <div class="loading-text">Initializing Maintenance System...</div>
    </div>
  </div>
  <script src="flutter_bootstrap.js" async></script>
  <script>
    window.addEventListener('load', function() {
      var observer = new MutationObserver(function(mutations) {
        for (var mutation of mutations) {
          for (var node of mutation.addedNodes) {
            if (node.tagName === 'FLUTTER-VIEW' || node.tagName === 'CANVAS') {
              var loading = document.getElementById('loading');
              if (loading) {
                loading.style.opacity = '0';
                loading.style.transition = 'opacity 0.4s ease-out';
                setTimeout(() => loading.remove(), 400);
              }
              observer.disconnect();
            }
          }
        }
      });
      observer.observe(document.body, { childList: true });
    });
  </script>
</body>
</html>
